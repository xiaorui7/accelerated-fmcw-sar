[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "high-performance-telemetry-engine"
version = "1.0.0"
description = "Validated, bounded-memory processing for heterogeneous industrial telemetry"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "numba>=0.60", "PyYAML>=6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[project.scripts]
telemetry = "telemetry_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
