[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "accelerated-fmcw-sar"
version = "0.1.0"
description = "Reproducible CPU FMCW-SAR simulation and backprojection benchmarks"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "scipy>=1.11", "matplotlib>=3.8", "numba>=0.60", "PyYAML>=6", "psutil>=5.9"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
sar = "sar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
